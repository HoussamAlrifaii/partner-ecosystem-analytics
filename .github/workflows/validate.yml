# CI checks behavior whenever a commit or pull request reaches GitHub.
name: Validate analytics foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m partner_analytics.generate
      - run: python -m partner_analytics.pipeline
